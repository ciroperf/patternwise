name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: hotspots selftest
        run: python skills/patternwise/scripts/hotspots.py --selftest
      - name: manifests and frontmatter
        run: |
          python - <<'PY'
          import json, re
          versions = {json.load(open(p))["version"] for p in (".claude-plugin/plugin.json", ".codex-plugin/plugin.json")}
          assert len(versions) == 1, f"plugin versions differ: {versions}"
          json.load(open(".claude-plugin/marketplace.json"))
          head = open("skills/patternwise/SKILL.md", encoding="utf-8").read().split("---")[1]
          name = re.search(r"^name:\s*(.+)$", head, re.M).group(1).strip()
          desc = re.search(r"^description:\s*(.+)$", head, re.M).group(1).strip()
          assert name == "patternwise", name
          assert len(desc) <= 1024, f"description too long: {len(desc)}"
          assert re.search(r"^disable-model-invocation:\s*true$", head, re.M), "skill must be explicit-only"
          assert "allow_implicit_invocation: false" in open("skills/patternwise/agents/openai.yaml").read()
          print("ok", versions, len(desc))
          PY
      - name: reference links resolve
        run: |
          cd skills/patternwise
          grep -oh 'references/[A-Za-z0-9_/-]*\.md' SKILL.md references -r | sort -u | while read f; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
