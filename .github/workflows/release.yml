name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches both plugin versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            version=$(jq -r .version "$f")
            if [ "$tag" != "$version" ]; then
              echo "Tag v$tag does not match $f version $version" >&2
              exit 1
            fi
          done

      - name: Hotspots selftest
        run: python3 skills/patternwise/scripts/hotspots.py --selftest

      - name: Build package
        run: |
          mkdir -p dist
          zip -r "dist/patternwise-${GITHUB_REF_NAME}.zip" skills/patternwise README.md LICENSE CHANGELOG.md -x '*__pycache__*'

      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $version" >&2; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "patternwise $GITHUB_REF_NAME" --notes-file notes.md
